services:
  mcp-humanizer:
    build: .
    container_name: mcp-humanizer
    restart: unless-stopped
    environment:
      - PUID=1026
      - PGID=100
      - TZ=America/Vancouver
      - PORT=8016
      - HOST=0.0.0.0
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-mcp-humanizer}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-mcp-humanizer@human.local}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=nicojan/mcp-humanizer
    ports:
      - "8016:8016"
    # For production, supply secrets through an env_file or your host's secret
    # manager rather than the shell environment, bind the port to 127.0.0.1
    # only (serving through a reverse proxy or tunnel), and set resource limits.
    #
    # A named volume is used (not a host bind) because the entrypoint runs
    # `git init` and `git fetch`/`reset --hard` inside /app/data; binding a
    # checked-out ./data here would collide with that git state.
    volumes:
      - mcp-humanizer-data:/app/data
    user: "1026:100"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mcp-humanizer-data:
